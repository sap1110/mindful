<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA-ready viewport: full-screen capable, respects device safe areas -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="color-scheme" content="light" />

    <meta
      name="description"
      content="Mindful is a calm, private mental-health companion. Everything you write stays on your device. Not a substitute for professional medical advice."
    />
    <meta name="application-name" content="Mindful" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mindful" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      The privacy promise, enforced by the browser rather than by good manners.

      Mindful tells people that what they write never leaves their device. A
      promise like that is only worth the mechanism behind it, so this policy
      makes the leak impossible rather than merely unintended: there is no
      origin this page is allowed to send anything to.

        connect-src 'self'  no fetch, XHR, WebSocket, SSE or beacon to any
                            other origin — the one line that makes exfiltration
                            of a journal entry a blocked request instead of a
                            code review question. The embedding model's weights
                            are the sole exception, and are named explicitly
                            below rather than covered by a wildcard.
        form-action 'none'  nothing can be POSTed anywhere, by any route.
        object-src 'none'   no plugins, no legacy embedding.
        base-uri 'self'     an injected <base> cannot re-point relative URLs.
        font-src 'self'     fonts are served from here; see src/fonts.css for
                            why they no longer come from a CDN.
        img-src             'self' plus data:/blob:, which the export download
                            and inline SVGs need. No remote images means no
                            tracking pixel can be smuggled into any content.

      'wasm-unsafe-eval' and blob: workers are what ONNX Runtime needs to run
      the embedding model on-device. They widen script execution, not network
      reach — the point of running the model here is that the alternative is
      sending the text to somebody's API.

      Kept as a meta tag so it travels with the app to any static host. Where a
      real server is in front of it, the same policy belongs in a response
      header, along with frame-ancestors, which meta cannot express.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'wasm-unsafe-eval';
               style-src 'self' 'unsafe-inline';
               font-src 'self';
               img-src 'self' data: blob:;
               media-src 'self' blob:;
               worker-src 'self' blob:;
               connect-src 'self' blob: https://huggingface.co https://cdn-lfs.hf.co https://cdn-lfs-us-1.hf.co https://cas-bridge.xethub.hf.co;
               form-action 'none';
               frame-src 'none';
               object-src 'none';
               base-uri 'self'"
    />

    <!-- Nothing is sent anywhere, so nothing should carry a referrer either. -->
    <meta name="referrer" content="no-referrer" />

    <title>Mindful — a calmer place to check in</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: Georgia, serif; margin: 3rem auto; max-width: 34rem; color: #1b211e">
        <h1>Mindful</h1>
        <p>
          Mindful needs JavaScript to run. Everything it stores stays on your own device.
        </p>
        <p><strong>Mindful is not medical advice.</strong> If you are in crisis, contact your
        local emergency services or a crisis line right away.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
